rules:
  - nome: "2D Elasticity - Full Constructor"
    padrao: '\bTPZElasticity2D\b'
    requer: 'TPZElasticity2D\s*\([^)]*,[^)]*,[^)]*,[^)]*,[^)]*,[^)]*\)'
    incompativel_com: '\bSetElasticity\b'
    aviso: "For TPZElasticity2D, always use the full constructor with 6 arguments (id, E, nu, fx, fy, planestress) and NEVER use SetElasticity(), because it does not initialize the constitutive law."

  - nome: "Mixed Darcy - Multiphysics Mesh"
    padrao: '\bTPZMixedDarcyFlow\b|\bTPZMultiphysicsCompMesh\b'
    requer: '\bBuildMultiphysicsSpace\b'
    incompativel_com: null
    aviso: "In the mixed formulation (TPZMixedDarcyFlow / TPZMultiphysicsCompMesh), you MUST use cmesh->BuildMultiphysicsSpace() and not AutoBuild()."

  - nome: "Mixed Darcy - Solver"
    padrao: '\bTPZMixedDarcyFlow\b'
    requer: '\bELDLt\b|\bELU\b'
    incompativel_com: '\bECholesky\b'
    aviso: "Mixed systems are saddle-point (indefinite) problems. The solver MUST use ELDLt or ELU, NEVER ECholesky."

  - nome: "Poisson - Do not use the old API"
    padrao: '\bTPZMatPoisson\b'
    requer: null
    incompativel_com: '\bTPZDummyFunction\b|\bTPZMatLaplacian\b'
    aviso: "The current TPZMatPoisson API uses std::function directly. Do not use TPZDummyFunction or TPZMatLaplacian."

  - nome: "H1 Darcy - Permeability"
    padrao: '\bTPZDarcyFlow\b'
    requer: '\bSetConstantPermeability\b'
    incompativel_com: '\bTPZHybridDarcyFlow\b|\bTPZMixedDarcyFlow\b'
    aviso: "You are using TPZDarcyFlow (H1 formulation), but forgot to call SetConstantPermeability(). Add a call to that method. Keep the TPZDarcyFlow class, do not change the material."
