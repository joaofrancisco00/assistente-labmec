[project]
name = "assistente-labmec"
version = "0.1.0"
description = "Assistente de programação NeoPZ baseado em RAG local (Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "gradio>=4.0",
    "langchain-chroma>=0.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=0.0.3",
    "langchain-ollama>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langchain>=0.2.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=2.7.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["base_de_dados", "venv", "build", "banco_chroma", "banco_chroma_develop", "reference_solutions", "wiki_neopz"]

[tool.ruff.lint]
select = ["E9", "F", "B", "SIM"]
ignore = ["SIM102", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"pipeline/__init__.py" = ["F401"]
"pipeline/config.py" = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
